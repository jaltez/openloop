name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: openloop-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: openloop-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: openloop-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: openloop-darwin-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Native build only for targets the host toolchain can link;
      # aarch64-linux is built by the `cross` step below (the host cc cannot
      # link glibc for that target).
      - name: Build release binary
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install cross for aarch64-linux
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p binaries
          cp target/${{ matrix.target }}/release/openloop binaries/${{ matrix.binary_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: binaries/${{ matrix.binary_name }}
          if-no-files-found: error

  verify:
    runs-on: ubuntu-latest
    needs: build
    # Must match the "Environment" field registered in the npm trusted
    # publisher settings for the openloop package.
    environment: npm
    permissions:
      contents: read
      # Lets the workflow's OIDC token be exchanged for a short-lived npm
      # publish grant — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json ($version)."
            exit 1
          fi

      # Collect every prebuilt platform binary. The npm tarball ships only
      # these; for other platforms, install from source (git clone + cargo
      # build) or point OPENLOOP_BIN at an existing binary — registry tarballs
      # contain no Rust sources, so postinstall cannot build there.
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      # upload-artifact@v4 does not preserve file permissions; restore the
      # executable bit so verification passes and the packed tarball ships
      # runnable binaries (npm pack preserves modes).
      - name: Restore executable permissions
        run: chmod +x binaries/openloop-*

      - name: Verify staged binaries
        run: |
          ls -la binaries/
          for expected in openloop-linux-x64 openloop-linux-arm64 openloop-darwin-x64 openloop-darwin-arm64; do
            test -x "binaries/$expected" || { echo "::error::missing binaries/$expected"; exit 1; }
          done
          ./binaries/openloop-linux-x64 --version

      # release:verify runs clippy, the test suite, CLI smoke tests, and
      # validates the tarball contents (including the staged binaries).
      - name: Verify release
        run: npm run verify

      # The npm bundled with Node 22 predates OIDC trusted publishing;
      # npm >= 11.5 is required.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish
