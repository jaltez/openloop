name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment" field registered in the npm trusted
    # publisher settings for the openloop package.
    environment: npm
    permissions:
      contents: read
      # Lets the workflow's OIDC token be exchanged for a short-lived npm
      # publish grant — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # Node for the typecheck and the final publish; bun for everything else.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # prepack builds via bun (bun bun-build.ts).
      - uses: oven-sh/setup-bun@v2

      # Install from the canonical bun.lock — a second lockfile always drifts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The npm bundled with Node 22 predates OIDC trusted publishing;
      # npm >= 11.5 is required.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json ($version)."
            exit 1
          fi

      # release:verify runs typecheck, the test suite, the build, CLI smoke
      # tests, and validates the tarball contents.
      - name: Verify release
        run: npm run release:verify

      - name: Publish to npm
        run: npm publish
