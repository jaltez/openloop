name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json ($version)."
            exit 1
          fi

      # release:verify runs clippy, the test suite, the release build, CLI
      # smoke tests, and validates the tarball contents.
      - name: Verify release
        run: npm run verify

      # Build the linux-x64 binary shipped inside the npm tarball. The bin
      # shim resolves it automatically; other platforms build from source
      # via the postinstall script or use OPENLOOP_BIN.
      - name: Stage prebuilt binary
        run: |
          mkdir -p binaries
          cp target/release/openloop "binaries/openloop-${RUNNER_OS_LC}-${RUNNER_ARCH_LC}"
        env:
          RUNNER_OS_LC: linux
          RUNNER_ARCH_LC: x64

      # The npm bundled with Node 22 predates OIDC trusted publishing;
      # npm >= 11.5 is required.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish
