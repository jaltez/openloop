name: Publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Must match the "Environment" field registered in the npm trusted
    # publisher settings for the openloop package.
    environment: npm
    permissions:
      contents: read
      # Lets the workflow's OIDC token be exchanged for a short-lived npm
      # publish grant — no NPM_TOKEN secret involved.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json ($version)."
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release --locked

      # Stage the linux-x64 binary BEFORE verification so the pack-manifest
      # gate can require it. The npm tarball ships only this prebuilt; for
      # other platforms, install from source (git clone + cargo build) or
      # point OPENLOOP_BIN at an existing binary — registry tarballs contain
      # no Rust sources, so postinstall cannot build there.
      - name: Stage prebuilt binary
        run: |
          mkdir -p binaries
          cp target/release/openloop binaries/openloop-linux-x64

      # release:verify runs clippy, the test suite, CLI smoke tests, and
      # validates the tarball contents (including the staged binary).
      - name: Verify release
        run: npm run verify

      # The npm bundled with Node 22 predates OIDC trusted publishing;
      # npm >= 11.5 is required.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish
