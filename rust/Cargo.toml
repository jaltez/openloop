[package]
name = "openloop"
version = "0.7.0"
edition = "2021"
description = "Global CLI and service for unattended Pi-driven development across linked repositories."
license = "MIT"

[[bin]]
name = "openloop"
path = "src/main.rs"

[dependencies]
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
ureq = { version = "2", features = ["json"] }
include_dir = "0.7"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
